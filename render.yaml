databases:
  - name: signaldesk-db
    databaseName: signaldesk
    user: signaldesk
    plan: free
    region: singapore
    postgresMajorVersion: "16"

services:
  - type: web
    name: signaldesk-api
    runtime: docker
    plan: free
    region: singapore
    repo: https://github.com/Aswinsaipalakonda/SignalDesk
    branch: main
    autoDeployTrigger: commit
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: signaldesk-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://signaldesk.vercel.app
      - key: SEED_MAX_ROWS
        value: "0"
